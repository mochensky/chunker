name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version (e.g.: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: chunker.exe
            asset: chunker-windows-amd64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: chunker
            asset: chunker-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: chunker
            asset: chunker-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: chunker
            asset: chunker-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set the version
        shell: bash
        # The first `version` of the workspace manifest is `[workspace.package]`.
        run: perl -0pi -e 's/^version = ".*?"/version = "${{ inputs.version }}"/m' Cargo.toml

      - name: Build
        shell: bash
        env:
          # The allocator (mimalloc) is C code: build it with the musl toolchain on Linux.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p build
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} build/${{ matrix.asset }}

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          path: build
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/chunker-windows-amd64.exe
            build/chunker-linux-amd64
            build/chunker-linux-arm64
            build/chunker-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
